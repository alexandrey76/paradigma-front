# nginx.conf (для Timeweb Apps)
worker_processes  1;

events { worker_connections  1024; }

http {
  include       mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout  65;

  server {
    # Timeweb Apps обычно ждёт приложение на 8080
    listen 8080;

    # CRA build лежит здесь после сборки
    root /app/build;
    index index.html;

    # === ВАЖНО: разрешаем встраивание в Telegram WebView ===
    add_header X-Frame-Options "" always;
    add_header Content-Security-Policy "frame-ancestors 'self' https://*.telegram.org https://web.telegram.org https://*.t.me" always;

    # === MIME-типы, чтобы WebView не блокировал бандлы из-за nosniff ===
    types {
      application/javascript  js mjs;
      text/css                css;
      application/wasm        wasm;
      image/svg+xml           svg;
      application/json        json;
    }

    # к статикам добавим CORS (на всякий случай)
    location ~* \.(js|css|map|wasm)$ {
      add_header Access-Control-Allow-Origin "*" always;
      try_files $uri =404;
    }

    # статика (изображения/шрифты)
    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp|ttf|otf|woff|woff2)$ {
      try_files $uri =404;
    }

    # SPA: всё остальное — на index.html
    location / {
      try_files $uri /index.html;
    }
  }
}
