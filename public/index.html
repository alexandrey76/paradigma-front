<!DOCTYPE html>
<html lang="ru">
  <head>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
      try { Telegram?.WebApp?.expand?.(); } catch {}
    </script>

    <meta charset="utf-8" />

    <!-- ВАЖНО: запрет масштабирования -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />

    <title>Paradigma</title>

    <style>
      /* Без pinch-zoom; оставляем только скролл по осям */
      html, body { touch-action: pan-x pan-y; }
    </style>

    <script>
      // Блокируем pinch (iOS Safari) и двойной тап
      (function(){
        const prevent = e => e.preventDefault();

        document.addEventListener("gesturestart", prevent, { passive: false });
        document.addEventListener("gesturechange", prevent, { passive: false });
        document.addEventListener("gestureend", prevent, { passive: false });

        let lastTouchEnd = 0;
        const onTouchEnd = e => {
          const now = Date.now();
          if (now - lastTouchEnd <= 300) e.preventDefault();
          lastTouchEnd = now;
        };
        document.addEventListener("touchend", onTouchEnd, { passive: false });

        // Блок Ctrl/⌘ + колесо/клавиши (на десктопе)
        const onWheel = e => { if (e.ctrlKey) e.preventDefault(); };
        const onKey = e => {
          if ((e.ctrlKey || e.metaKey) && ["+", "=", "-", "0"].includes(e.key)) {
            e.preventDefault();
          }
        };
        window.addEventListener("wheel", onWheel, { passive: false });
        window.addEventListener("keydown", onKey);
      })();
    </script>
  </head>
  <body>
    <noscript>Включите JavaScript для работы приложения.</noscript>
    <div id="root"></div>
  </body>
</html>
